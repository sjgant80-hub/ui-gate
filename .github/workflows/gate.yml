name: proof-of-play
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: the kernel against its falsifiable examples
        run: node --test uigate.test.mjs

      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the tests (must be CLEAN)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate uigate.mjs \
            --timeout 60000 --cap 900 \
            --baseline witness.baseline.json \
            --test node --test uigate.test.mjs

      - name: the live page still carries the gated kernel
        run: |
          cp index.html /tmp/shipped.html
          node build-page.mjs
          diff -q /tmp/shipped.html index.html || {
            echo "::error::index.html has drifted from uigate.mjs — run node build-page.mjs and commit."
            exit 1
          }

      - name: the gate eats its own dog food — the broken fixture must trip, the clean one must not
        run: node test/fixtures.check.mjs
